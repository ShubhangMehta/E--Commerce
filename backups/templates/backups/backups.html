<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Backups Dashboard</title>

    <!-- Simple styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f7f7f7;
        }
        .container {
            width: 80%;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 40px;
        }
        .card {
            padding: 25px;
            background: #ffffff;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ddd;
            transition: 0.3s;
        }
        .card:hover {
            background: #f2f8ff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            padding: 10px 18px;
            margin-top: 15px;
            background: #007BFF;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }
        .btn:hover {
            background: #0056c7;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Backup Management Dashboard</h1>

    <div class="menu-grid">

        <!-- DOWNLOAD BACKUPS -->
        <div class="card">
            <h2>Download Backups</h2>
            <p>View and download backup files for all tenants.</p>
            <a href="{% url 'download_backups' %}" class="btn">Open</a>
            <!-- <li><a href="/backups/download/">Download Backups</a></li> -->
        </div>

        <!-- RESTORE BACKUPS -->
        <div class="card">
            <h2>Restore Backups</h2>
            <p>Restore backups for any tenant from available backups.</p>
            <a href="{% url 'restore_backups' %}" class="btn">Open</a>
            <!-- <li><a href="/backups/restore/">Restore Backups</a></li> -->
        </div>

        <!-- BACKUP GRAPH -->
        <div class="card">
            <h2>Backup Status Summary</h2>
            <p>Success/failure chart of recent backup jobs.</p>
            <a href="{% url 'backup_stats' %}" class="btn">View Graph</a>
            <!-- <li><a href="/backups/graph/">Backup Status Graph</a></li> -->
        </div>

    </div>

</div>

</body>
</html>
