<h2>Daily Backups</h2>

<form id="dailyForm">
    <input type="text" name="tenant" placeholder="Enter tenant" required>
    <input type="date" name="date" required>
    <button type="submit">Get Backup Link</button>
</form>

<!-- Correct Django URL for normal POST -->
<form method="POST" action="{% url 'generate_backup_link_daily' %}">
    {% csrf_token %}
    <button type="submit">Generate Daily Backup Link</button>
</form>

<div id="result"></div>

<script>
document.getElementById("dailyForm").onsubmit = async function(e) {
    e.preventDefault();

    let formData = new FormData(this);

    // 🔥 Use Django URL instead of relative path
    let url = "{% url 'generate_backup_link_daily' %}";

    let res = await fetch(url, {
        method: "POST",
        headers: { "X-CSRFToken": "{{ csrf_token }}" }, 
        body: formData
    });

    let data = await res.json();

    if (data.url) {
        document.getElementById("result").innerHTML =
            `<a href="${data.url}" target="_blank">Download Backup</a>`;
    } else {
        document.getElementById("result").innerHTML = data.error;
    }
};
</script>
