<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Backups</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            max-width: 480px;
            margin: 60px auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-top: 12px;
            display: block;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1e40af;
        }

        .result {
            margin-top: 20px;
            text-align: center;
        }

        .result a {
            color: #16a34a;
            font-weight: bold;
            text-decoration: none;
        }

        .error {
            color: #dc2626;
            font-weight: bold;
        }

        .loading {
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>📦 Daily Backup Download</h2>

    <form id="dailyForm">
        {% csrf_token %}

        <label>Tenant Name</label>
        <input type="text" name="tenant" placeholder="e.g. tenant_abc" required>

        <label>Backup Date</label>
        <input type="date" name="date" required>

        <label>Tenant Type</label>
        <select name="tenant_type" required>
            <option value="">-- Select Tenant Type --</option>
            <option value="all_tenants">All Tenants</option>
            <option value="existing_tenants">Existing Tenants</option>
        </select>

        <button type="submit">🔍 Get Backup</button>
    </form>

    <div id="result" class="result"></div>
</div>

<script>
document.getElementById("dailyForm").onsubmit = async function(e) {
    e.preventDefault();

    const resultDiv = document.getElementById("result");
    resultDiv.innerHTML = "<p class='loading'>⏳ Generating backup link...</p>";

    const formData = new FormData(this);

    const url = "{% url 'backups:api_generate_daily' %}";

    try {
        const res = await fetch(url, {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        if (data.url) {
            resultDiv.innerHTML = `
                <a href="${data.url}" target="_blank">
                    ⬇️ Download Backup
                </a>
            `;
        } else {
            resultDiv.innerHTML = `<p class="error">${data.error}</p>`;
        }

    } catch (err) {
        resultDiv.innerHTML = "<p class='error'>❌ Something went wrong</p>";
    }
};
</script>

</body>
</html>
