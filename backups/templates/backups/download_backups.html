<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Backup Type</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .backup-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .backup-btn {
            text-decoration: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .backup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .daily {
            background: linear-gradient(135deg, #1abc9c, #16a085);
        }

        .weekly {
            background: linear-gradient(135deg, #3498db, #2980b9);
        }

        .master {
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Select Backup Type</h2>
        <div class="subtitle">
            Choose the type of backup you want to download
        </div>

        <div class="backup-buttons">
            <a href="{% url 'backups:daily' %}" class="backup-btn daily">
                📅 Daily Backups
            </a>

            <a href="{% url 'backups:weekly' %}" class="backup-btn weekly">
                📆 Weekly Backups
            </a>

            <a href="{% url 'backups:master' %}" class="backup-btn master">
                🗄️ Master Backups
            </a>
        </div>

        <div class="footer-text">
            Secure & Automated Backup System
        </div>
    </div>
</body>
</html>
