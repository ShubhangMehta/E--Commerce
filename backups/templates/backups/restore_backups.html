<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restore Backups</title>

    <style>
        body { font-family: Arial; background: #f3f3f3; }
        .container { width: 80%; margin: 40px auto; background: white; padding: 25px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #28a745; color: white; }
        .btn { padding: 7px 14px; background: #28a745; color: white; border-radius: 5px; border: none; cursor: pointer; }
        .btn:hover { background: #1f7d33; }
        h1, h2 { text-align: center; }
        .section { margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #ccc; }
        input, select { padding: 8px; width: 50%; margin: 8px 0; }
        #result, #msg { font-size: 16px; margin-top: 15px; }
    </style>
</head>

<body>

<div class="container">

    <h1>Restore Backups</h1>

    <!-- ========================
         OPTION 1 — Restore by file
         ======================== -->
    <!-- This section is commented properly & safely -->
    <!--
    <div class="section">
        <h2>Option 1: Restore Using a Backup File</h2>

        {% if files %}
            <label>Select Backup File:</label><br>
            <select id="backup-file">
                {% for file in files %}
                    <option value="{{ file }}">{{ file }}</option>
                {% endfor %}
            </select>

            <br><br>

            <label>Database Password:</label><br>
            <input type="password" id="db-password">

            <br><br>

            <button class="btn" onclick="restoreBackupFile()">Restore</button>

            <p id="msg"></p>

        {% else %}
            <p>No backup files available.</p>
        {% endif %}
    </div>
    -->


    <!-- ========================
         OPTION 2 — Restore Tenant + Date
         ======================== -->
    <div class="section">
        <h2>Option 2: Restore Tenant Backup (Tenant + Date)</h2>

        <form id="restoreForm">
            {% csrf_token %}

            <label>Tenant Name</label><br>
            <input type="text" name="tenant" required>

            <br>

            <label>Backup Date (YYYY-MM-DD)</label><br>
            <input type="text" name="date" required>

            <br><br>

            <button type="submit" class="btn">Restore Backup</button>
        </form>

        <div id="result"></div>
    </div>

</div>


<!-- ========================
     JAVASCRIPT (Fixed + Clean)
     ======================== -->
<script>

// ---------------------------
// OPTION 1 — Restore by file
// ---------------------------
function restoreBackupFile() {
    const filename = document.getElementById("backup-file").value;
    const password = document.getElementById("db-password").value;
    const msg = document.getElementById("msg");

    const formData = new FormData();
    formData.append("filename", filename);
    formData.append("password", password);

    fetch("/backups/restore-api/", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        msg.style.color = data.status === "success" ? "green" : "red";
        msg.innerText = data.message || data.error;
    })
    .catch(() => {
        msg.style.color = "red";
        msg.innerText = "❌ Something went wrong!";
    });
}


// -------------------------------------------
// OPTION 2 — Restore by tenant & date
// -------------------------------------------
document.getElementById("restoreForm").onsubmit = async function(e) {
    e.preventDefault();

    const formData = new FormData(e.target);
    const result = document.getElementById("result");

    try {
        const response = await fetch("{% url 'restore_backup_api' %}", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        result.style.color = data.status === "success" ? "green" : "red";

        if (data.status === "success") {
            result.innerHTML = "✔ Backup restored successfully!";
        } 
        else {
            result.innerHTML = "❌ Restore failed: " + data.error;
        }

    } catch {
        result.style.color = "red";
        result.innerHTML = "❌ Something went wrong!";
    }
};

</script>

</body>
</html>
