    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(";").shift();
        }

        function subscribe() {

            const tenantName = document.getElementById("tenant_name").value;
            const email = document.getElementById("email").value;
            const domain = document.getElementById("domain").value;
            const planName = document.getElementById("plan").value;

            if (!tenantName || !email || !domain) {
                alert("Tenant Name, Email & Domain are required");
                return;
            }

            const interval = document.querySelector(
                `#plan option[value="${planName}"]`
            ).dataset.interval;

            const fd = new FormData();
            fd.append("tenant_name", tenantName);
            fd.append("email", email);
            fd.append("domain", domain);
            fd.append("plan", planName);
            fd.append("interval", interval);

            fetch("{% url 'rzp_start' %}", {
                method: "POST",
                headers: { "X-CSRFToken": getCookie("csrftoken") },
                body: fd
            })
            .then(res => res.json())
            .then(data => {
                if (!data.ok) {
                    alert(data.error || "Error starting subscription");
                    return;
                }

                const rzp = new Razorpay({
                    key: data.rzp_key,
                    subscription_id: data.razorpay_subscription_id,
                    name: "Your SaaS",
                    description: planName + " Subscription",
                    handler: function () {
                        alert("Payment successful! Tenant will be created automatically.");
                        window.location.href = "/"; 
                    }
                });

                rzp.open();
            });
        }
    </script>
