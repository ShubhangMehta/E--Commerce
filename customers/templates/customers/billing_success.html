<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provisioning</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    .box { max-width: 720px; margin: 0 auto; border: 1px solid #ddd; border-radius: 12px; padding: 24px; }
    .muted { color: #555; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Payment successful.</h2>
    <p class="muted">Provisioning your site…</p>
    <p class="muted" id="hint">You will be redirected automatically.</p>
  </div>

  <script>
    // Wait 1.5 seconds, then reload this same page.
    // Once provisioning is done, the server-side view will redirect.
    setTimeout(() => {
      window.location.href = "/billing/success/?invoice_id={{ invoice_id|escapejs }}";
    }, 1500);
  </script>
</body>
</html>
