<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Tenant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 12px;
        }

        input, select {
            width: 100%;
            padding: 9px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .choice-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .choice {
            flex: 1;
            border: 1px solid #ccc;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            background: #fafafa;
        }

        .choice input {
            margin-right: 5px;
        }

        .payment-section {
            display: none;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .note {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
    </style>

    <script>
        function togglePayment(show) {
            document.getElementById("payment-section").style.display =
                show ? "block" : "none";
        }
    </script>
</head>

<body>
<div class="container">
    <h2>Create Tenant Request</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Tenant Name</label>
        <input type="text" name="tenant_name" required>

        <label>Domain Name</label>
        <input type="text" name="domain_name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Company</label>
        <input type="text" name="company">

        <label>Address</label>
        <input type="text" name="address">

        <!-- PLAN -->
        <label>Select Plan</label>
        <select name="plan" required>
            <option value="">-- Select --</option>
            <option value="basic">Basic</option>
            <option value="standard">Standard</option>
            <option value="premium">Premium</option>
        </select>
        <!-- THEME -->
        <label>Select Theme</label>
        <select name="theme" required>
            <option value="default">Default</option>
            <option value="minimal">Minimal</option>
            <option value="modern">Modern</option>
        </select>

        <!-- TRIAL OR PAID -->
        <label>How do you want to start?</label>
        <div class="choice-box">
            <label class="choice">
                <input type="radio" name="subscription_type" value="trial"
                       onclick="togglePayment(false)" required>
                🆓 Free Trial
                <div class="note">Try before you pay</div>
            </label>

            <label class="choice">
                <input type="radio" name="subscription_type" value="paid"
                       onclick="togglePayment(true)">
                💳 Subscription
                <div class="note">Monthly or Yearly billing</div>
            </label>
        </div>

        <!-- PAYMENT OPTIONS -->
        <div id="payment-section" class="payment-section">
            <label>Billing Cycle</label>
            <select name="payment_plan">
                <option value="monthly">Monthly</option>
                <option value="yearly">Yearly (Save 10% more) </option>
            </select>
        </div>

        <button type="submit">Submit Request</button>
    </form>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}
</div>
</body>
</html>
