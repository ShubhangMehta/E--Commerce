<!DOCTYPE html>
<html>
<head>
    <title>Choose Plan</title>
</head>
<body>

<h2>Choose a Subscription Plan</h2>

<ul>
{% for plan in plans %}
    <li>
        <strong>{{ plan.name }}</strong><br>
        Price: ₹{{ plan.price }}<br>
        Duration: {{ plan.duration_days }} days<br><br>

        <a href="/billing/renew/?plan={{ plan.id }}">
            Choose {{ plan.name }}
        </a>
    </li>
    <hr>
{% endfor %}
</ul>

</body>
</html>
