<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Refund Request</title>
</head>
<body>

<h2>Request a Refund</h2>

<form method="POST">
    {% csrf_token %}

    <label>Tenant Name:</label><br>
    <input type="text" name="tenant_name" value="{{ client.tenant_name }}" readonly><br><br>

    <label>Tenant Domain:</label><br>
    <input type="text" name="tenant_domain" value="{{ client.desired_domain }}" readonly><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" value="{{ client.email }}" readonly><br><br>

    <label>Reason for Refund:</label><br>
    <textarea name="reason" required placeholder="Explain why you need a refund..."></textarea><br><br>

    <label>Status:</label><br>
    <select name="status">
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="cancelled">Cancelled</option>
    </select><br><br>

    <button type="submit">Submit Refund Request</button>
</form>
<table>
<tr>
<th>Order</th>
<th>Customer</th>
<th>Amount</th>
<th>Reason</th>
<th>Action</th>
</tr>

{% for order in orders %}
<tr>
<td>{{ order.id }}</td>
<td>{{ order.customer }}</td>
<td>{{ order.total_amount }}</td>
<td>{{ order.refund_reason }}</td>

<td>
<a href="{% url 'approve_refund' order.id %}">Approve</a>
<a href="{% url 'reject_refund' order.id %}">Reject</a>
</td>

</tr>
{% endfor %}
</table>

{% if order.status == "delivered" %}
<a href="{% url 'request_refund' order.id %}">
    Request Refund
</a>
{% endif %}
</body>
</html>
