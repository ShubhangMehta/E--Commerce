<!DOCTYPE html>
<html>
<head>
    <title>Subscription Plans</title>
    <style>
        .plan-card {
            border: 1px solid #ddd;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            width: 300px;
            display: inline-block;
            text-align: center;
        }
        .plan-title {
            font-size: 22px;
            font-weight: bold;
        }
        .price {
            font-size: 28px;
            color: #0088ff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Available Subscription Plans</h1>

{% for plan in plans %}
<div class="plan-card">
    <div class="plan-title">{{ plan.get_name_display }}</div>
    <p>{{ plan.description }}</p>
    <p class="price">₹{{ plan.price }}</p>
    <p>Duration: {{ plan.duration_days }} days</p>
    <p>Status: {{ plan.get_status_display }}</p>
</div>
{% empty %}
<p>No plans available.</p>
{% endfor %}

</body>
</html>
