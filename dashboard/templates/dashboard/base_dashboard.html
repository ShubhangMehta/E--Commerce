<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ tenant.tenant_name }} Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white shadow h-screen fixed">
        <div class="p-6 text-xl font-bold border-b">
            {{ tenant.tenant_name }}
        </div>
        <nav class="p-4 space-y-4">
            <a href="/dashboard/" class="block hover:text-blue-600">Dashboard</a>
            <a href="/dashboard/products/" class="block hover:text-blue-600">Products</a>
            <a href="/dashboard/orders/" class="block hover:text-blue-600">Orders</a>
            <a href="/dashboard/customers/" class="block hover:text-blue-600">Customers</a>
            <a href="/dashboard/settings/" class="block hover:text-blue-600">Settings</a>
            <a href="/dashboard/themes/" class="block hover:text-blue-600">Themes</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="ml-64 p-6 w-full">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
