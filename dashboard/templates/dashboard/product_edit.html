{% extends "dashboard/base_dashboard.html" %}
{% block content %}
<h1 class="text-xl font-bold">{{ title }}</h1>

<form method="POST" enctype="multipart/form-data" class="mt-6 space-y-4">
    {% csrf_token %}

    <input name="name" value="{{ product.name }}" class="w-full p-3 border rounded" placeholder="Product Name">

    <input name="price" value="{{ product.price }}" class="w-full p-3 border rounded" placeholder="Price">

    <textarea name="description" class="w-full p-3 border rounded" placeholder="Description">{{ product.description }}</textarea>

    <input type="file" name="image" class="w-full p-3 border rounded">

    <button class="px-4 py-2 bg-blue-600 text-white rounded">Save</button>
</form>

{% endblock %}
