{% extends "dashboard/base_dashboard.html" %}

{% block content %}
<div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">Products</h1>
    <a href="/dashboard/products/create/" class="px-4 py-2 bg-blue-600 text-white rounded">Add Product</a>
</div>

<table class="mt-6 w-full bg-white shadow rounded">
    <thead class="border-b">
        <tr>
            <th class="text-left p-3">Name</th>
            <th class="text-left p-3">Price</th>
            <th class="text-left p-3">Stock</th>
            <th class="p-3">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
        <tr class="border-b">
            <td class="p-3">{{ p.name }}</td>
            <td class="p-3">${{ p.price }}</td>
            <td class="p-3">{{ p.stock }}</td>
            <td class="p-3 text-center">
                <a href="/dashboard/products/{{ p.id }}/edit/" class="text-blue-600">Edit</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
