<!doctype html>
<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce Store</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    .cart-badge {
      animation: cartPop 0.3s ease-out;
    }
    
    @keyframes cartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    
    .product-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="w-full h-full overflow-auto"><!-- Header -->
   <header id="header" class="w-full shadow-sm sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
     <div>
      <h1 id="store-name" class="font-bold">ShopHub</h1>
      <p id="tagline" class="text-sm">Your one-stop shop</p>
     </div><button id="cart-button" class="relative px-4 py-2 rounded-lg font-medium transition-colors"> 🛒 Cart (<span id="cart-count">0</span>) </button>
    </div>
   </header><!-- Hero Section -->
   <section id="hero-section" class="w-full">
    <div class="max-w-7xl mx-auto px-4 py-16 text-center">
     <h2 id="hero-title" class="font-bold mb-4">Discover Amazing Products</h2>
     <p id="hero-subtitle" class="mb-8">Shop the latest trends with unbeatable prices</p><button id="cta-button" class="px-8 py-3 rounded-lg font-medium transition-colors">Shop Now</button>
    </div>
   </section><!-- Products Grid -->
   <section class="w-full">
    <div class="max-w-7xl mx-auto px-4 py-12">
     <h3 id="products-title" class="font-bold mb-8">Featured Products</h3>
     <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"><!-- Products will be inserted here -->
     </div>
    </div>
   </section><!-- Shopping Cart Sidebar -->
   <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-96 shadow-2xl transform translate-x-full transition-transform duration-300 z-20">
    <div class="h-full flex flex-col">
     <div class="p-6 border-b flex items-center justify-between">
      <h3 class="font-bold">Shopping Cart</h3><button id="close-cart" class="px-3 py-1 rounded-lg text-sm transition-colors">Close</button>
     </div>
     <div id="cart-items" class="flex-1 overflow-auto p-6"><!-- Cart items will be inserted here -->
     </div>
     <div class="border-t p-6">
      <div class="flex items-center justify-between mb-4"><span class="font-bold">Total:</span> <span id="cart-total" class="font-bold">$0.00</span>
      </div><button id="checkout-button" class="w-full py-3 rounded-lg font-medium transition-colors">Checkout</button>
     </div>
    </div>
   </div><!-- Cart Overlay -->
   <div id="cart-overlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-10"></div>
  </div>
  <script>
    const defaultConfig = {
      background_color: "#f9fafb",
      surface_color: "#ffffff",
      text_color: "#111827",
      primary_action: "#3b82f6",
      secondary_action: "#6b7280",
      font_family: "sans-serif",
      font_size: 16,
      store_name: "ShopHub",
      tagline: "Your one-stop shop",
      hero_title: "Discover Amazing Products",
      hero_subtitle: "Shop the latest trends with unbeatable prices",
      cta_button: "Shop Now"
    };

    const products = [
      { id: 1, name: "Wireless Headphones", price: 79.99, emoji: "🎧" },
      { id: 2, name: "Smart Watch", price: 199.99, emoji: "⌚" },
      { id: 3, name: "Laptop Backpack", price: 49.99, emoji: "🎒" },
      { id: 4, name: "Coffee Maker", price: 89.99, emoji: "☕" },
      { id: 5, name: "Desk Lamp", price: 34.99, emoji: "💡" },
      { id: 6, name: "Bluetooth Speaker", price: 59.99, emoji: "🔊" },
      { id: 7, name: "Fitness Tracker", price: 129.99, emoji: "💪" },
      { id: 8, name: "Phone Stand", Price: 19.99, emoji: "📱" }
    ];

    let cart = [];

    function renderProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = products.map(product => `
        <div class="product-card rounded-lg shadow p-6 flex flex-col items-center text-center" style="background: ${window.elementSdk.config.surface_color || defaultConfig.surface_color};">
          <div class="text-6xl mb-4">${product.emoji}</div>
          <h4 class="font-semibold mb-2" style="color: ${window.elementSdk.config.text_color || defaultConfig.text_color}; font-size: ${(window.elementSdk.config.font_size || defaultConfig.font_size) * 1.125}px; font-family: ${window.elementSdk.config.font_family || defaultConfig.font_family}, sans-serif;">${product.name}</h4>
          <p class="font-bold mb-4" style="color: ${window.elementSdk.config.text_color || defaultConfig.text_color}; font-size: ${(window.elementSdk.config.font_size || defaultConfig.font_size) * 1.25}px; font-family: ${window.elementSdk.config.font_family || defaultConfig.font_family}, sans-serif;">$${product.price.toFixed(2)}</p>
          <button onclick="addToCart(${product.id})" class="w-full py-2 rounded-lg font-medium transition-colors" style="background: ${window.elementSdk.config.primary_action || defaultConfig.primary_action}; color: white; font-size: ${window.elementSdk.config.font_size || defaultConfig.font_size}px; font-family: ${window.elementSdk.config.font_family || defaultConfig.font_family}, sans-serif;">Add to Cart</button>
        </div>
      `).join('');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const existingItem = cart.find(item => item.id === productId);
      
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      
      updateCart();
      
      const badge = document.getElementById('cart-count');
      badge.classList.remove('cart-badge');
      void badge.offsetWidth;
      badge.classList.add('cart-badge');
    }

    function removeFromCart(productId) {
      cart = cart.filter(item => item.id !== productId);
      updateCart();
    }

    function updateQuantity(productId, change) {
      const item = cart.find(item => item.id === productId);
      if (item) {
        item.quantity += change;
        if (item.quantity <= 0) {
          removeFromCart(productId);
        } else {
          updateCart();
        }
      }
    }

    function updateCart() {
      const cartCount = document.getElementById('cart-count');
      const cartItems = document.getElementById('cart-items');
      const cartTotal = document.getElementById('cart-total');
      
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      
      cartCount.textContent = totalItems;
      cartTotal.textContent = `$${totalPrice.toFixed(2)}`;
      
      if (cart.length === 0) {
        cartItems.innerHTML = `<p class="text-center" style="color: ${window.elementSdk.config.secondary_action || defaultConfig.secondary_action}; font-size: ${window.elementSdk.config.font_size || defaultConfig.font_size}px; font-family: ${window.elementSdk.config.font_family || defaultConfig.font_family}, sans-serif;">Your cart is empty</p>`;
      } else {
        cartItems.innerHTML = cart.map(item => `
          <div class="mb-4 p-4 rounded-lg" style="background: ${window.elementSdk.config.background_color || defaultConfig.background_color};">
            <div class="flex items-center justify-between mb-2">
              <span class="font-medium" style="color: ${window.elementSdk.config.text_color || defaultConfig.text_color}; font-size: ${window.elementSdk.config.font_size || defaultConfig.font_size}px; font-family: ${window.elementSdk.config.font_family || defaultConfig.font_family}, sans-serif;">${item.emoji} ${item.name}</span>
              <button onclick="removeFromCart(${item.id})" class="px-2 py-1 rounded text-sm transition-colors" style="background: ${window.elementSdk.config.secondary_action || defaultConfig.secondary_action}; color: white; font-size: ${(window.elementSdk.config.font_size || defaultConfig.font_size) * 0.875}px;">Remove</button>
            </div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <button onclick="updateQuantity(${item.id}, -1)" class="px-2 py-1 rounded" style="background: ${window.elementSdk.config.surface_color || defaultConfig.surface_color}; border: 1px solid ${window.elementSdk.config.secondary_action || defaultConfig.secondary_action}; font-size: ${window.elementSdk.config.font_size || defaultConfig.font_size}px;">-</button>
                <span style="color: ${window.elementSdk.config.text_color || defaultConfig.text_color}; font-size: ${window.elementSdk.config.font_size || defaultConfig.font_size}px; font-family: ${window.elementSdk.config.font_family || defaultConfig.font_family}, sans-serif;">${item.quantity}</span>
                <button onclick="updateQuantity(${item.id}, 1)" class="px-2 py-1 rounded" style="background: ${window.elementSdk.config.surface_color || defaultConfig.surface_color}; border: 1px solid ${window.elementSdk.config.secondary_action || defaultConfig.secondary_action}; font-size: ${window.elementSdk.config.font_size || defaultConfig.font_size}px;">+</button>
              </div>
              <span class="font-bold" style="color: ${window.elementSdk.config.text_color || defaultConfig.text_color}; font-size: ${window.elementSdk.config.font_size || defaultConfig.font_size}px; font-family: ${window.elementSdk.config.font_family || defaultConfig.font_family}, sans-serif;">$${(item.price * item.quantity).toFixed(2)}</span>
            </div>
          </div>
        `).join('');
      }
    }

    function toggleCart() {
      const sidebar = document.getElementById('cart-sidebar');
      const overlay = document.getElementById('cart-overlay');
      const isOpen = !sidebar.classList.contains('translate-x-full');
      
      if (isOpen) {
        sidebar.classList.add('translate-x-full');
        overlay.classList.add('hidden');
      } else {
        sidebar.classList.remove('translate-x-full');
        overlay.classList.remove('hidden');
      }
    }

    document.getElementById('cart-button').addEventListener('click', toggleCart);
    document.getElementById('close-cart').addEventListener('click', toggleCart);
    document.getElementById('cart-overlay').addEventListener('click', toggleCart);
    document.getElementById('cta-button').addEventListener('click', () => {
      document.getElementById('products-grid').scrollIntoView({ behavior: 'smooth' });
    });
    document.getElementById('checkout-button').addEventListener('click', () => {
      const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
      if (totalItems > 0) {
        const checkoutMessage = document.createElement('div');
        checkoutMessage.className = 'fixed top-20 right-4 px-6 py-4 rounded-lg shadow-lg z-30';
        checkoutMessage.style.background = window.elementSdk.config.primary_action || defaultConfig.primary_action;
        checkoutMessage.style.color = 'white';
        checkoutMessage.style.fontSize = `${window.elementSdk.config.font_size || defaultConfig.font_size}px`;
        checkoutMessage.style.fontFamily = `${window.elementSdk.config.font_family || defaultConfig.font_family}, sans-serif`;
        checkoutMessage.textContent = 'Checkout feature coming soon!';
        document.body.appendChild(checkoutMessage);
        setTimeout(() => checkoutMessage.remove(), 3000);
      }
    });

    async function onConfigChange(config) {
      const baseSize = config.font_size || defaultConfig.font_size;
      const customFont = config.font_family || defaultConfig.font_family;
      const baseFontStack = 'sans-serif';
      
      // Apply background
      document.getElementById('app').style.background = config.background_color || defaultConfig.background_color;
      
      // Header
      const header = document.getElementById('header');
      header.style.background = config.surface_color || defaultConfig.surface_color;
      
      const storeName = document.getElementById('store-name');
      storeName.textContent = config.store_name || defaultConfig.store_name;
      storeName.style.color = config.text_color || defaultConfig.text_color;
      storeName.style.fontSize = `${baseSize * 1.5}px`;
      storeName.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      const tagline = document.getElementById('tagline');
      tagline.textContent = config.tagline || defaultConfig.tagline;
      tagline.style.color = config.secondary_action || defaultConfig.secondary_action;
      tagline.style.fontSize = `${baseSize * 0.875}px`;
      tagline.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      const cartButton = document.getElementById('cart-button');
      cartButton.style.background = config.primary_action || defaultConfig.primary_action;
      cartButton.style.color = 'white';
      cartButton.style.fontSize = `${baseSize}px`;
      cartButton.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      // Hero section
      const heroSection = document.getElementById('hero-section');
      heroSection.style.background = config.surface_color || defaultConfig.surface_color;
      
      const heroTitle = document.getElementById('hero-title');
      heroTitle.textContent = config.hero_title || defaultConfig.hero_title;
      heroTitle.style.color = config.text_color || defaultConfig.text_color;
      heroTitle.style.fontSize = `${baseSize * 2}px`;
      heroTitle.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      const heroSubtitle = document.getElementById('hero-subtitle');
      heroSubtitle.textContent = config.hero_subtitle || defaultConfig.hero_subtitle;
      heroSubtitle.style.color = config.secondary_action || defaultConfig.secondary_action;
      heroSubtitle.style.fontSize = `${baseSize * 1.125}px`;
      heroSubtitle.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      const ctaButton = document.getElementById('cta-button');
      ctaButton.textContent = config.cta_button || defaultConfig.cta_button;
      ctaButton.style.background = config.primary_action || defaultConfig.primary_action;
      ctaButton.style.color = 'white';
      ctaButton.style.fontSize = `${baseSize * 1.125}px`;
      ctaButton.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      // Products title
      const productsTitle = document.getElementById('products-title');
      productsTitle.style.color = config.text_color || defaultConfig.text_color;
      productsTitle.style.fontSize = `${baseSize * 1.875}px`;
      productsTitle.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      // Cart sidebar
      const cartSidebar = document.getElementById('cart-sidebar');
      cartSidebar.style.background = config.surface_color || defaultConfig.surface_color;
      
      const closeCart = document.getElementById('close-cart');
      closeCart.style.background = config.secondary_action || defaultConfig.secondary_action;
      closeCart.style.color = 'white';
      closeCart.style.fontSize = `${baseSize * 0.875}px`;
      closeCart.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      const checkoutButton = document.getElementById('checkout-button');
      checkoutButton.style.background = config.primary_action || defaultConfig.primary_action;
      checkoutButton.style.color = 'white';
      checkoutButton.style.fontSize = `${baseSize}px`;
      checkoutButton.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      renderProducts();
      updateCart();
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (value) => {
                config.surface_color = value;
                window.elementSdk.setConfig({ surface_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.primary_action || defaultConfig.primary_action,
              set: (value) => {
                config.primary_action = value;
                window.elementSdk.setConfig({ primary_action: value });
              }
            },
            {
              get: () => config.secondary_action || defaultConfig.secondary_action,
              set: (value) => {
                config.secondary_action = value;
                window.elementSdk.setConfig({ secondary_action: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ["store_name", config.store_name || defaultConfig.store_name],
          ["tagline", config.tagline || defaultConfig.tagline],
          ["hero_title", config.hero_title || defaultConfig.hero_title],
          ["hero_subtitle", config.hero_subtitle || defaultConfig.hero_subtitle],
          ["cta_button", config.cta_button || defaultConfig.cta_button]
        ])
      });
      
      onConfigChange(window.elementSdk.config);
    }
    
    renderProducts();
    updateCart();
  </script>
