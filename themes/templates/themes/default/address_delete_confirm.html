{% extends "themes/default/storefront.html" %}

{% block title %}Delete Address{% endblock %}
{% block content %}
<div class="container" style="max-width: 640px;">
  <div class="card p-4">
    <h1 class="h5 fw-bold mb-2">Delete address?</h1>
    <p class="text-muted2 mb-3">
      {{ address.house_no }}, {{ address.landmark }}, {{ address.city }} - {{ address.postal_code }}
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button class="btn btn-danger" type="submit">Delete</button>
        <a class="btn btn-outline-dark" href="{% url 'profile' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
