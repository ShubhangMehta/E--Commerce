{% extends "themes/default/storefront.html" %}

{% block title %}Address{% endblock %}
{% block content %}
<div class="container" style="max-width: 760px;">
  <div class="card p-4">
    <h1 class="h5 fw-bold mb-3">{% if address %}Edit{% else %}Add{% endif %} Address</h1>

    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Full name</label>
          <input class="form-control" name="full_name" value="{{ address.full_name|default:member.full_name }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input class="form-control" name="phone" value="{{ address.phone|default:member.phone }}">
        </div>

        <div class="col-12">
          <label class="form-label">House/Flat No</label>
          <input class="form-control" name="house_no" value="{{ address.house_no|default:'' }}">
        </div>
        <div class="col-12">
          <label class="form-label">Landmark</label>
          <input class="form-control" name="landmark" value="{{ address.landmark|default:'' }}">
        </div>

        <div class="col-md-4">
          <label class="form-label">City</label>
          <input class="form-control" name="city" value="{{ address.city|default:'' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">State</label>
          <input class="form-control" name="state" value="{{ address.state|default:'' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Postal code</label>
          <input class="form-control" name="postal_code" value="{{ address.postal_code|default:'' }}">
        </div>

        <div class="col-md-6">
          <label class="form-label">Address type</label>
          <select class="form-select" name="address_type">
            <option value="home" {% if address and address.address_type == "home" %}selected{% endif %}>Home</option>
            <option value="work" {% if address and address.address_type == "work" %}selected{% endif %}>Work</option>
            <option value="office" {% if address and address.address_type == "office" %}selected{% endif %}>Office</option>
            <option value="other" {% if address and address.address_type == "other" %}selected{% endif %}>Other</option>
          </select>
        </div>

        <div class="col-md-6 d-flex align-items-end">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_default"
              {% if address and address.is_default %}checked{% endif %}>
            <label class="form-check-label">Set as default</label>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-dark" type="submit">Save</button>
        <a class="btn btn-outline-dark" href="{% url 'users:profile' %}">Back</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
