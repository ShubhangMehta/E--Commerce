{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Dashboard | {{ request.tenant.tenant_name|default:"Tenant" }}{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background-color: #ffffff; color: #000000; }
    a { color: inherit; text-decoration: none; }
    header { background-color: #007BFF; padding: 0.75rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; color: #ffffff; font-size: 1.4rem; }
    nav a { color: #ffffff; margin-left: 1rem; font-weight: 500; }
    main { padding: 2rem 1.5rem; max-width: 960px; margin: 0 auto; }
    footer { background-color: #f8f9fa; text-align: center; padding: 1rem 0; font-size: 0.85rem; color: #555; }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>
  <header>
      <h1>My Dashboard</h1>
      <nav>
          <a href="{% url 'dashboard:home' %}">Home</a>
          <a href="#">Profile</a>
          <a href="#">Settings</a>
          <a href="{% url 'logout' %}">Logout</a>
      </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
      &copy; {{ current_year|default:"2024" }} My Company. All rights reserved.
  </footer>
</body>
</html>
