{% extends "themes/default/base_storefront.html" %}

{% block content %}
<div class="flex gap-6">
    <img src="{{ product.image.url }}" class="w-64 h-64 object-cover rounded">

    <div>
        <h1 class="text-3xl font-bold">{{ product.name }}</h1>
        <p class="text-gray-700 my-2">{{ product.description }}</p>
        <p class="text-2xl font-bold mb-4">${{ product.price }}</p>

        <button class="px-4 py-2 bg-blue-600 text-white rounded">Add to Cart</button>
    </div>
</div>
{% endblock %}
