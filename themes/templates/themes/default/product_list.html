{% extends "themes/default/base_storefront.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Products</h1>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    {% for p in products %}
    <div class="bg-white p-4 rounded shadow">
        <img src="{{ p.image.url }}" class="h-40 w-full object-cover rounded">
        <h2 class="text-lg font-semibold mt-2">{{ p.name }}</h2>
        <p class="text-gray-700">${{ p.price }}</p>
        <a href="/products/{{ p.id }}/" class="text-blue-600">View</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
