{% extends "themes/minimal/storefront.html" %}

{% block title %}Your Cart | {{ request.tenant.name }}{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <h1 class="serif text-4xl text-brandViolet mb-8">Shopping Cart # 

    <div class="bg-white p-8 border border-brandGold/10 shadow-sm">

        <p class="text-gray-500 italic">Your cart is currently empty.

        <div class="mt-8 border-t border-brandGold/20 pt-6 flex justify-between items-center">

            <span class="serif text-xl text-brandViolet">Total: $0.00</span>

            <a href="/checkout/" class="px-8 py-3 bg-brandViolet text-white font-semibold uppercase tracking-widest text-xs hover:bg-opacity-90 transition-all">

                Checkout

            

        

    

{% endblock %}
