{% extends "themes/minimal/storefront.html" %}

{% block title %}Profile | {{ request.tenant.name }}{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">

    <div class="flex items-center gap-6 mb-12">

        <div class="w-20 h-20 bg-brandViolet text-white serif text-3xl flex items-center justify-center rounded-full border-2 border-brandGold">

            {{ user.username|slice:":1"|default:"U" }}

        

        

            <h1 class="serif text-4xl text-brandViolet">{{ user.username|default:"Valued Guest" }} # 

            <p class="text-brandGold text-sm uppercase tracking-widest">Premium Member

        

    

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

        <div class="bg-white p-8 border border-brandGold/10">

            <h3 class="text-xs font-bold uppercase tracking-widest mb-4">Account Details

            <p class="text-sm text-gray-500">Email: {{ user.email }}

        

    

{% endblock %}

```
