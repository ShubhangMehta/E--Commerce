{% extends "themes/default/base_storefront.html" %}

{% block title %}Join Us | {{ request.tenant.name }}{% endblock %}

{% block content %}

<div class="max-w-md mx-auto py-12">

    <div class="bg-white p-10 border-t-4 border-brandGold shadow-xl">

        <h1 class="serif text-3xl text-brandViolet mb-6 text-center">Create Account # 

        <form class="space-y-4">

            <input type="text" placeholder="Full Name" class="w-full border-gray-200 focus:border-brandViolet p-3 outline-none">

            <input type="email" placeholder="Email" class="w-full border-gray-200 focus:border-brandViolet p-3 outline-none">

            <input type="password" placeholder="Password" class="w-full border-gray-200 focus:border-brandViolet p-3 outline-none">

            <button class="w-full py-3 bg-brandViolet text-white font-bold uppercase tracking-widest text-xs mt-4">Register</button>

        </form>

    

{% endblock %}
