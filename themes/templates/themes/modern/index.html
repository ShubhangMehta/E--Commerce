{% extends "themes/modern/base_storefront.html" %}
{% block content %}
<section class="max-w-[1400px] mx-auto px-10 py-16">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-20 items-center">
        <div class="lg:col-span-5">
            <h1 class="serif-fancy text-7xl md:text-[100px] leading-[0.9] mb-8 font-light italic">
                Simplicity <br> <span class="not-italic text-champagne">Elevated</span>
            </h1>
            <p class="text-sm leading-relaxed opacity-60 mb-12 max-w-sm">
                Curating objects of permanence. We believe in the beauty of the raw, the refined, and the intentional.
            </p>
            <div class="flex items-center gap-8">
                <a href="/products/" class="bg-noir text-alabaster px-12 py-5 text-[10px] uppercase tracking-[0.3em] hover:bg-champagne hover:text-noir transition-all duration-500">
                    Explore Archive
                </a>
            </div>
        </div>

        <div class="lg:col-span-7 relative group">
            <div class="aspect-[16/10] bg-zinc-200 overflow-hidden relative border border-noir/5">
                <div class="absolute inset-0 bg-noir/5 group-hover:bg-transparent transition-all duration-1000"></div>
                <div class="absolute bottom-6 right-6 text-white serif-fancy text-xl opacity-0 group-hover:opacity-100 transition-opacity">
                    Collection / 25
                </div>
            </div>
            <div class="absolute -bottom-10 -left-10 w-40 h-40 border border-champagne/30 hidden lg:block -z-10"></div>
        </div>
    </div>
</section>
{% endblock %}
