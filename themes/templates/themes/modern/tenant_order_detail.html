<!DOCTYPE html>
<html>
<head>
    <title>Order Detail</title>
    <style>
        .card {
            width: 400px;
            border: 1px solid #ccc;
            padding: 20px;
            margin-top: 20px;
        }
        .label {
            font-weight: bold;
        }
    </style>
</head>
<body>

<h2>Order Detail (Tenant View)</h2>

<div class="card">
    <p><span class="label">Order ID:</span> #{{ order.id }}</p>
    <p><span class="label">Customer:</span> {{ order.customer.username }}</p>
    <p><span class="label">Tenant:</span> {{ order.tenant }}</p>
    <p><span class="label">Total Amount:</span> ₹{{ order.total_amount }}</p>
    <p><span class="label">Status:</span> {{ order.status }}</p>
    <p><span class="label">Created At:</span> {{ order.created_at }}</p>
</div>

</body>
</html>
