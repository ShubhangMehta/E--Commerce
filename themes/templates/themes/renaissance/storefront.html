{% extends "themes/renaissance/base_storefront.html" %}

{% block content %}
<h1 class="text-3xl font-serif text-[#3b2a1a] mb-10 text-center">
  Artisan Market
</h1>

<div class="grid grid-cols-4 gap-8">

  <div class="bg-[#fffaf2] border border-[#d8c9a3] p-6 text-center font-serif">
    <h3 class="text-lg mb-2">Oil Painting</h3>
    <p class="text-sm text-[#6a543a]">₹12,000</p>
  </div>

  <div class="bg-[#fffaf2] border border-[#d8c9a3] p-6 text-center font-serif">
    <h3 class="text-lg mb-2">Sculpted Bust</h3>
    <p class="text-sm text-[#6a543a]">₹18,500</p>
  </div>

  <div class="bg-[#fffaf2] border border-[#d8c9a3] p-6 text-center font-serif">
    <h3 class="text-lg mb-2">Illuminated Manuscript</h3>
    <p class="text-sm text-[#6a543a]">₹9,800</p>
  </div>

  <div class="bg-[#fffaf2] border border-[#d8c9a3] p-6 text-center font-serif">
    <h3 class="text-lg mb-2">Bronze Relic</h3>
    <p class="text-sm text-[#6a543a]">₹22,000</p>
