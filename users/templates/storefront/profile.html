{% extends theme_base %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="section">
    <h1 class="page-title">My Profile</h1>

    <form method="POST">
      {% csrf_token %}

      <div class="row g-3">
        <div class="col-md-6">
          <label class="fw-semibold mb-1">Full Name</label>
          <input type="text" name="full_name"
                 value="{{ subject.full_name }}"
                 class="form-control">
        </div>

        <div class="col-md-6">
          <label class="fw-semibold mb-1">Email</label>
          <input type="email"
                 value="{{ request.user.email }}"
                 class="form-control"
                 disabled>
        </div>

        <div class="col-md-6">
          <label class="fw-semibold mb-1">Phone</label>
          <input type="text" name="phone"
                 value="{{ subject.phone }}"
                 class="form-control">
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-brand">
          Update Profile
        </button>

        <a href="{% url 'users_theme:address' %}"
           class="btn btn-soft">
           Manage Addresses
        </a>
      </div>

    </form>
  </div>

</div>
{% endblock %}
